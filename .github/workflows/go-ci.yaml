---
name: Go CI
on:
  pull_request:
  push:
    branches: ["main"]
  # Run once a week (see https://crontab.guru)
  schedule:
    - cron: "0 0 * * 0"
  workflow_dispatch:

permissions: {}

jobs:
  go-ci:
    uses: CowDogMoo/renovate-config/.github/workflows/go-ci.yaml@main
    permissions:
      contents: read
    with:
      go-version-file: magefiles/go.mod
      go-linters: false
      go-installs: github.com/magefile/mage@latest
      pre-commit-command: mage installDeps && mage runPreCommit
      tests: false
